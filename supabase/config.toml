project_id = "crewcore"

[api]
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
port = 54323

[inbucket]
port = 54324

[storage]
file_size_limit = "50MiB"

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# stripe-webhook authenticates via Stripe-Signature header, not a Supabase JWT.
# verify_jwt = false prevents 401s on inbound Stripe webhook calls.
[functions.stripe-webhook]
verify_jwt = false
